name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          for suite in test_prepare.py test_link_libc.py test_patches.py test_packaged_vulkan.py test_trophies.py test_cheats.py; do
            python3 -m unittest discover -s tests -p "$suite" -q
          done
      - name: Shell syntax
        run: |
          for script in build.sh run.sh packaging/appimage.sh packaging/linux/package.sh packaging/linux/build_dlss.sh packaging/linux/AppRun packaging/windows/package.sh; do
            bash -n "$script"
          done
      - name: Python syntax
        run: python3 -m compileall -q scripts launcher packaging/windows

  linux:
    name: Linux AppImage
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 240
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git ca-certificates curl build-essential cmake ninja-build pkgconf file binutils \
            python3 python3-venv python3-dev python3-tk xvfb xauth \
            libsdl3-dev libvulkan-dev libfmt-dev libboost-dev robin-map-dev \
            libvulkan-memory-allocator-dev libxxhash-dev libx11-dev libzydis-dev libzycore-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libprotobuf-dev protobuf-compiler nlohmann-json3-dev libssl-dev zlib1g-dev \
            libminiupnpc-dev glslang-tools glslang-dev spirv-headers
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Build Linux binaries
        run: |
          git config --global --add safe.directory '*'
          BB_JOBS=3 bash build.sh
      - name: Add DLSS and FSR 4 assets
        run: |
          bash packaging/linux/build_dlss.sh
          bash tools/fetch_fsr4_assets.sh
      - name: Package and verify AppImage
        run: |
          bash packaging/linux/package.sh
          cd dist
          sha256sum --check *.AppImage.sha256
      - name: Smoke test launcher window
        run: |
          set +e
          timeout 30s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage
          code=$?
          set -e
          test "$code" -eq 124
      - uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows portable ZIP
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve checkout line endings
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: winpython
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
      - name: Verify clean checkout
        run: |
          git status --short --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare DLSS SDK and FSR 4 assets
        run: |
          git clone --depth 1 --branch v310.9.16 https://github.com/NVIDIA/DLSS.git out/dlss-sdk
          bash tools/fetch_fsr4_assets.sh
      - name: Build and package Windows ZIP
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          WINPYTHON: ${{ steps.winpython.outputs.python-path }}
        run: |
          bash build.sh
          DLSS_SDK_ROOT="$PWD/out/dlss-sdk" CMAKE_EXE="/c/Program Files/CMake/bin/cmake.exe" bash packaging/windows/build_dlss.sh
          bash packaging/windows/package.sh
          cd dist
          sha256sum --check *.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-build
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: windows-build
          path: dist
      - name: Verify release packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f "Uncharted-${GITHUB_REF_NAME}-x86_64.AppImage"
          test -f "Uncharted-${GITHUB_REF_NAME}-windows.zip"
          sha256sum --check -- *.sha256
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          linux="dist/Uncharted-${GITHUB_REF_NAME}-x86_64.AppImage"
          windows="dist/Uncharted-${GITHUB_REF_NAME}-windows.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
            gh release upload "$GITHUB_REF_NAME" "$linux" "$windows" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$linux" "$windows" --verify-tag --draft --generate-notes
          fi
