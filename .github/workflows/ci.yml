# Continuous integration.
#
# Three jobs, matching the three test layers:
#   python-tests   the scripts and launcher settings tests (fastest, no build)
#   c-tests-linux  the HLE runtime tests, built natively
#   c-tests-win    the same tests under the MSYS2 CLANG64 toolchain that builds
#                  the shipped Windows package
#
# None of this needs a GPU or game files: the C++ renderer tests are built
# separately (see build-renderer-tests, opt-in) because they need the whole GPU
# library, which takes far longer than this workflow's budget.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the suite
        run: python -m unittest discover -s tests -v

  c-tests-linux:
    name: C tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # SDL3 is not packaged for Ubuntu (no libsdl3-dev), and miniz is not
      # packaged at all. tests/build.sh drops the modules that need them and
      # still runs the rest, so install only what Ubuntu actually has and let
      # test_pad be skipped rather than failing the whole job.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev \
            nlohmann-json3-dev

      # The tests link the HLE runtime but not the GPU library, so the Vulkan,
      # SDL3 and FFmpeg packages below are all that is needed here.
      - name: Build and run
        run: bash tests/build.sh

  c-tests-win:
    name: C tests (Windows / MSYS2 CLANG64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # msys2/setup-msys2 installs CLANG64 and the packages named in
      # packaging/windows/README.md. The extra ones are what the C tests link:
      # SDL3 (runtime_pad.c) and FFmpeg (runtime_ajm.c).
      # Use the full arch-qualified names. setup-msys2 does not expand short
      # names, and pacman reports "target not found" for both "SDL3" and
      # "mingw-w64-sdl3" on a clean runner. These are the names
      # `pacman -Q` reports locally under CLANG64.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-git
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg

      - name: Build and run
        run: bash tests/build.sh

  licenses:
    name: License set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Every license in the manifest must resolve to a real file, so a renamed
      # or removed third-party license fails the build instead of shipping a
      # package with an incomplete set.
      - name: Check the manifest
        run: |
          set -e
          manifest=packaging/windows/licenses/MANIFEST.txt
          missing=0
          while IFS='|' read -r name source kind; do
            [[ -z ${name// } || $name == \#* ]] && continue
            [[ $kind == pkg ]] && continue   # resolved from MSYS2 at package time
            [[ -z ${source// } ]] && continue
            if [[ ! -f $source ]]; then
              echo "missing: $name <- $source"
              missing=1
            fi
          done < "$manifest"
          exit $missing

  # The loader plus the whole vendored renderer. Slow, and it does not fit the
  # shortest signal, but it is the only job that catches a break in the GPU
  # build or in the FSR-Vulkan patch application. Runs on push to main, on pull
  # requests, and on demand; not on every branch push.
  build-windows:
    name: Full build (Windows)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-git
            mingw-w64-clang-x86_64-patch
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-fmt

      # The runner uses git's default core.autocrlf=true, which checks the FSR-Vulkan
      # submodule out with CRLF and makes the patches fail to apply. Nothing overrides
      # it here, so this job exercises the same path a fresh Windows clone hits.
      - name: Build bb-probe.exe and run the C tests
        run: bash build.sh --test

      - name: Package
        run: bash packaging/windows/package.sh

  # The renderer tests are eight C++ targets in gpu/CMakeLists.txt. They need
  # the full shadPS4 build (long) and no GPU, so they are opt-in rather than
  # blocking every push.
  build-renderer-tests:
    name: Renderer tests (C++)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # miniz and SDL3 are not packaged for Ubuntu. The GPU build vendors miniz
      # under gpu/third_party/miniz, and the renderer test targets do not link
      # SDL3, so neither belongs in this package list.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            libvulkan-dev libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev libxxhash-dev \
            libboost-dev libfmt-dev nlohmann-json3-dev \
            glslang-tools spirv-cross libzydis-dev
      - name: Configure
        run: cmake -S gpu -B out/gpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DBB_PGO=off -DBB_LTO=OFF
      - name: Build the test targets
        run: |
          ninja -C out/gpu \
            motion-history-test ui-composition-test scene-resolution-test \
            motion-shader-test taa-shader-test camera-motion-test \
            upscaler-support-test
      - name: Run
        run: |
          for t in motion-history-test ui-composition-test scene-resolution-test \
                   motion-shader-test taa-shader-test camera-motion-test \
                   upscaler-support-test; do
            echo "::group::$t"
            ./out/gpu/$t
            echo "::endgroup::"
          done